[project]
name = "gemini-whatsapp"
version = "0.1.0"
description = "Gemini Live + WhatsApp Example."
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.14.0.94",
    "pipecat-ai[google,runner,silero,webrtc]==0.0.89",
    "pipecatcloud>=0.2.5",
]

[dependency-groups]
dev = [
    "ruff~=0.12.1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]
